openapi: 3.0.3
info:
  title: 街道环卫考核 API
  version: 1.1.0
  description: |-
    道路网格 / 保洁合同 / 问题事件 / 证据照片 / 处罚单元管理。

    核心规则：
    * 照片感知哈希(pHash)只用于生成**疑似重复候选**，是否同一问题由人工结合位置、时间判断；
    * 同一问题不同角度拍摄只计扣一次（照片挂接到已有事件）；
    * 已整改后同一位置复发 = 新事件、新处罚；
    * 扣分归属按**事件发生时**的合同责任区间，与录入时间无关；
    * 逾期升级基于可注入时钟；复核通过锁定处罚版本，更正只能追加新版本。

    离线采集包接入（/api/ingest/）：
    * 设备先上传暂存媒体（按 media_key 幂等），再批量上送操作（稳定操作号 + 设备内序号 + 业务发生时间 + 照片引用）；
    * 服务端保存不可变接收账本、设备水位与逐条回执；同一操作重放返回原结果；
    * 缺失前序的操作保持待处理，补齐后按序号顺序执行；失败可重试，不留半个业务结果。
paths:
  /api/candidates/:
    get:
      operationId: candidates_list
      description: 疑似重复候选：只读列表 + 人工判定动作。
      parameters:
      - in: query
        name: matched_photo
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - in: query
        name: photo
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: 判定状态
          enum:
          - confirmed_duplicate
          - different
          - pending
          - recurrence
          - rejected
        description: |-
          * `pending` - 待判定
          * `confirmed_duplicate` - 确认同问题（挂接，不重复扣分）
          * `recurrence` - 整改后复发（新建事件）
          * `different` - 不同地点/不同问题（不合并）
          * `rejected` - 误报忽略
      tags:
      - candidates
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDuplicateCandidateList'
          description: ''
  /api/candidates/{id}/:
    get:
      operationId: candidates_retrieve
      description: 疑似重复候选：只读列表 + 人工判定动作。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 疑似重复候选 的 唯一整数值。
        required: true
      tags:
      - candidates
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidate'
          description: ''
  /api/candidates/{id}/decide/:
    post:
      operationId: candidates_decide_create
      description: |-
        人工判定：
        attach=同一问题不同角度（挂接、不重复扣分）；
        create_new=另立新事件（已整改事件复发/不同地点）；
        different=标记不同不合并。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 疑似重复候选 的 唯一整数值。
        required: true
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateCandidate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DuplicateCandidate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DuplicateCandidate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidate'
          description: ''
