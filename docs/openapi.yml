      description: |-
        暂存媒体：设备先上传照片文件，再在采集包操作中按 media_key 引用。
        上传按 (设备, media_key) 幂等——中断重传返回原记录（200），同键不同内容 409。
        暂存媒体只读不可改删；被操作成功消费后才转为证据照片。
