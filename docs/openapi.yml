components:
  schemas:
    CandidateStatusEnum:
      enum:
      - pending
      - confirmed_duplicate
      - recurrence
      - different
      - rejected
      type: string
      description: |-
        * `pending` - 待判定
        * `confirmed_duplicate` - 确认同问题（挂接，不重复扣分）
        * `recurrence` - 整改后复发（新建事件）
        * `different` - 不同地点/不同问题（不合并）
        * `rejected` - 误报忽略
    CleaningContract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          title: 合同编号
          maxLength: 32
        grid:
          type: integer
          title: 道路网格
        contractor_name:
          type: string
          title: 承包商名称
          maxLength: 128
        valid_from:
          type: string
          format: date-time
          title: 责任开始时间（含）
        valid_to:
          type: string
          format: date-time
          title: 责任结束时间（不含）
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - code
      - contractor_name
      - created_at
      - grid
      - id
      - valid_from
      - valid_to
    CollectionDevice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device_no:
          type: string
          readOnly: true
          title: 设备编号
        name:
          type: string
          readOnly: true
          title: 设备名称
        received_watermark:
          type: integer
          readOnly: true
          title: 已连续接收序号
        applied_watermark:
          type: integer
          readOnly: true
          title: 已连续处理序号
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 最近通信时间
        applied_count:
          type: integer
          readOnly: true
        pending_count:
          type: integer
          readOnly: true
        ignored_count:
          type: integer
          readOnly: true
        failed_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - applied_count
      - applied_watermark
      - created_at
      - device_no
      - failed_count
      - id
      - ignored_count
      - last_seen_at
      - name
      - pending_count
      - received_watermark
    DuplicateCandidate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        photo:
          allOf:
          - $ref: '#/components/schemas/PhotoBrief'
          readOnly: true
        matched_photo:
          allOf:
          - $ref: '#/components/schemas/PhotoBrief'
          readOnly: true
        hamming_distance:
          type: integer
          readOnly: true
          title: PHash汉明距离
        status:
          allOf:
          - $ref: '#/components/schemas/CandidateStatusEnum'
          readOnly: true
          title: 判定状态
        status_display:
          type: string
          readOnly: true
        decision_note:
          type: string
          readOnly: true
          title: 判定说明
        decided_by:
          type: string
          readOnly: true
          title: 判定人
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 判定时间
      required:
      - decided_at
      - decided_by
      - decision_note
      - hamming_distance
      - id
      - matched_photo
      - photo
      - status
      - status_display
    EscalationRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        penalty:
          type: integer
          readOnly: true
          title: 处罚单元
        level:
          type: integer
          readOnly: true
          title: 升级到等级
        version:
          type: integer
          readOnly: true
          title: 产生的处罚版本
        reason:
          type: string
          readOnly: true
          title: 升级原因
        actor:
          type: string
          readOnly: true
          title: 执行任务
        ran_at:
          type: string
          format: date-time
          readOnly: true
          title: 执行时间(注入时钟)
      required:
      - actor
      - id
      - level
      - penalty
      - ran_at
      - reason
      - version
    EventBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_no:
          type: string
          readOnly: true
          title: 事件编号
        category:
          allOf:
          - $ref: '#/components/schemas/EventCategoryEnum'
          title: 问题类别
        status:
          allOf:
          - $ref: '#/components/schemas/EventStatusEnum'
          title: 状态
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          title: 发生/拍摄时间
          description: 归属与 SLA 都以该时间为准，而不是录入时间
        grid:
          type: integer
          nullable: true
          title: 所在网格
        contractor_name:
          type: string
          title: 责任承包商快照
          maxLength: 128
      required:
      - category
      - event_no
      - id
      - location
      - occurred_at
    EventCategoryEnum:
      enum:
      - litter
      - overflow
      - road_dirt
      - dead_corner
      - other
      type: string
      description: |-
        * `litter` - 散落垃圾
        * `overflow` - 垃圾桶满溢
        * `road_dirt` - 路面污渍
        * `dead_corner` - 卫生死角
        * `other` - 其他问题
    EventStatusEnum:
      enum:
      - open
      - rectified
      type: string
      description: |-
        * `open` - 待整改
        * `rectified` - 已整改
    EvidencePhoto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
          title: 图片文件
        phash:
          type: string
          readOnly: true
          title: 感知哈希(hex)
        captured_at:
          type: string
          format: date-time
          title: 拍摄时间
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
          writeOnly: true
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
          writeOnly: true
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
          readOnly: true
        uploader:
          type: string
          title: 上传人
          maxLength: 64
        note:
          type: string
          title: 备注
          maxLength: 256
        event:
          type: integer
          readOnly: true
          nullable: true
          title: 关联事件
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - captured_at
      - created_at
      - event
      - id
      - image
      - lat
      - lng
      - location
      - phash
    IngestBatch:
      type: object
      description: 采集包：同一设备的一批操作。逐条入账，逐条回执。
      properties:
        device_no:
          type: string
          maxLength: 64
        batch_no:
          type: string
          default: ''
          maxLength: 64
        operations:
          type: array
          items:
            $ref: '#/components/schemas/IngestOperation'
      required:
      - device_no
      - operations
    IngestBatchResponse:
      type: object
      properties:
        device_no:
          type: string
        received_watermark:
          type: integer
        applied_watermark:
          type: integer
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/IngestReceiptItem'
      required:
      - applied_watermark
      - device_no
      - receipts
      - received_watermark
    IngestOperation:
      type: object
      description: 单条设备操作：稳定操作号 + 设备内序号 + 业务发生时间 + 业务参数。
      properties:
        op_id:
          type: string
          maxLength: 64
        seq:
          type: integer
          minimum: 1
        type:
          $ref: '#/components/schemas/TypeEnum'
        occurred_at:
          type: string
          format: date-time
          description: 业务发生时间（归属/整改均以它为准）
        payload: {}
      required:
      - occurred_at
      - op_id
      - payload
      - seq
      - type
    IngestReceiptItem:
      type: object
      description: 批量接入响应中的逐条回执（status=conflict 表示与账本冲突、未入账）。
      properties:
        receipt_id:
          type: integer
          nullable: true
        op_id:
          type: string
        seq:
          type: integer
        status:
          $ref: '#/components/schemas/IngestReceiptItemStatusEnum'
        replayed:
          type: boolean
        result:
          nullable: true
        error:
          nullable: true
      required:
      - error
      - op_id
      - receipt_id
      - replayed
      - result
      - seq
      - status
    IngestReceiptItemStatusEnum:
      enum:
      - pending
      - applied
      - ignored
      - failed
      - conflict
      type: string
      description: |-
        * `pending` - pending
        * `applied` - applied
        * `ignored` - ignored
        * `failed` - failed
        * `conflict` - conflict
    OperationReceipt:
      type: object
      description: 逐条回执（含账本原文，支撑全链路追溯）。
      properties:
        id:
          type: integer
          readOnly: true
        device_no:
          type: string
          readOnly: true
        op_id:
          type: string
          readOnly: true
        seq:
          type: integer
          readOnly: true
        op_type:
          type: string
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        payload:
          readOnly: true
        batch_no:
          type: string
          readOnly: true
        received_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OperationReceiptStatusEnum'
          readOnly: true
          title: 处理状态
        status_display:
          type: string
          readOnly: true
        result:
          readOnly: true
          title: 业务结果快照
        error:
          readOnly: true
          title: 失败信息
        attempts:
          type: integer
          readOnly: true
          title: 执行次数
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 处理时间
      required:
      - attempts
      - batch_no
      - device_no
      - error
      - id
      - occurred_at
      - op_id
      - op_type
      - payload
      - processed_at
      - received_at
      - result
      - seq
      - status
      - status_display
    OperationReceiptStatusEnum:
      enum:
      - pending
      - applied
      - ignored
      - failed
      type: string
      description: |-
        * `pending` - 待处理（前序未齐）
        * `applied` - 已执行
        * `ignored` - 已忽略（业务幂等拒绝，如迟到的重复整改）
        * `failed` - 执行失败（可重试）
